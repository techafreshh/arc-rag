[project]
name = "arcrag-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai",
    "fastapi",
    "uvicorn",
    "httpx",
    "beautifulsoup4",
    "qdrant-client",
    "python-dotenv",
    "langfuse",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
