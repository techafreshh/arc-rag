services:
  arcpro-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/app/scripts/init.sh"]
    restart: "no"
    env_file: backend/.env
    environment:
      - QDRANT_COLLECTION=arcgis_docs
    volumes:
      - arcrag_data:/app/data

  arcmap-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/app/scripts/init.sh"]
    restart: "no"
    env_file: backend/.env
    environment:
      - QDRANT_COLLECTION=arcgis_docs
      - SOURCE=arcmap
    volumes:
      - arcrag_data:/app/data
    depends_on:
      arcpro-init:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    mem_limit: 1g
    env_file: backend/.env
    environment:
      - QDRANT_COLLECTION=arcgis_docs
    volumes:
      - arcrag_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      arcpro-init:
        condition: service_completed_successfully
      arcmap-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  arcrag_data:
